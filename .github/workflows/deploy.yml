name: deploy

# Build here, ship two binaries and a directory of files, restart there.
#
# The gate is `bun run check` — typecheck, the web tests, go vet, the Go tests
# and the smoke suite against a real PocketBase. Nothing reaches the server
# that has not played a whole group stage, a double elimination and a Swiss
# out to the end first.
on:
  push:
    branches: [master]
  # So a rollback or a re-run does not need a commit.
  workflow_dispatch:

concurrency:
  # Two deploys racing to swap the same binaries is the one way to get a
  # half-installed release. Queue rather than cancel: a build that has already
  # passed the gate is worth finishing.
  group: deploy-production
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - uses: actions/setup-go@v5
        with:
          # The floor is PocketBase's, not ours: v0.40 moved to
          # encoding/json/v2, which needs 1.27.
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - run: bun install --frozen-lockfile

      - name: Check
        run: bun run check

      - name: Build the API
        working-directory: backend
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        # Pure Go all the way down — PocketBase uses modernc's SQLite — so this
        # cross-compiles to a binary with nothing to install beside it.
        run: go build -trimpath -ldflags="-s -w" -o ../release/pocketbase .

      - name: Build the web
        working-directory: apps/web
        run: |
          bun run build
          # One binary with its own runtime inside it, so the server needs
          # neither Bun nor node_modules and cannot drift from the build.
          bun build --compile --target=bun-linux-x64 \
            dist/server/server.js --outfile ../../release/whistleday-web
          cp -r dist/client ../../release/client

      - name: Ship it
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Pinned rather than StrictHostKeyChecking=no: accepting whatever key
          # answers is accepting whatever machine answers.
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

          ssh "$DEPLOY_USER@$DEPLOY_HOST" 'rm -rf /srv/whistleday/staging && mkdir -p /srv/whistleday/staging'
          rsync -az --delete \
            release/ "$DEPLOY_USER@$DEPLOY_HOST:/srv/whistleday/staging/"
          scp deploy/release.sh "$DEPLOY_USER@$DEPLOY_HOST:/srv/whistleday/release.sh"
          ssh "$DEPLOY_USER@$DEPLOY_HOST" 'chmod +x /srv/whistleday/release.sh && /srv/whistleday/release.sh'

      - name: Check the real thing answers
        run: |
          # From outside, through Caddy and TLS, which is the only version of
          # "it works" that counts.
          for path in / /8-team-single-elimination-bracket /api/health; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' -m 15 "https://whistle.day$path")
            echo "$path -> $code"
            [ "$code" = "200" ] || exit 1
          done
